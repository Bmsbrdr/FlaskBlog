<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beitrag bearbeiten - FlaskBlog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Spezifisches Styling für das Formular, identisch zu add.html -->
    <style>
        .form-card {
            background-color: var(--card-bg, #ffffff);
            border: 1px solid var(--border-color, #e5e7eb);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #111827;
            font-size: 0.95rem;
        }

        /* Modernes Styling für Inputs und Textarea */
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color, #e5e7eb);
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        /* Blauer Rahmen bei Klick/Fokus */
        .form-control:focus {
            outline: none;
            border-color: var(--primary, #4f46e5);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        textarea.form-control {
            height: 200px;
            resize: vertical;
        }

        /* Professioneller Button */
        .btn-submit {
            background-color: var(--primary, #4f46e5);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #4338ca;
        }

        /* Link zurück zur Übersicht */
        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--text-muted, #6c757d);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--primary, #4f46e5);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Navigationsleiste -->
    <nav class="navbar">
        <a href="/" class="navbar-brand">📝 FlaskBlog</a>
    </nav>

    <!-- Zentrierter Formularbereich -->
    <main class="container">
        <h1>Beitrag bearbeiten</h1>

        <div class="form-card">
            <!-- Action sendet per POST an die ID des jeweiligen Blogeintrags -->
            <form method="POST" action="/edit/{{ blogentry.id }}">

                <div class="form-group">
                    <label for="author">Autor</label>
                    <input type="text" id="author" name="author" class="form-control" value="{{ blogentry.author }}" required placeholder="Dein Name">
                </div>

                <div class="form-group">
                    <label for="title">Titel</label>
                    <input type="text" id="title" name="title" class="form-control" value="{{ blogentry.title }}" required placeholder="Titel des Beitrags">
                </div>

                <div class="form-group">
                    <label for="content">Inhalt</label>
                    <textarea id="content" name="content" class="form-control" required placeholder="Schreibe deinen Text hier...">{{ blogentry.content }}</textarea>
                </div>

                <button type="submit" class="btn-submit">Änderungen speichern</button>
            </form>
        </div>

        <a href="/" class="back-link">← Zurück zur Übersicht</a>
    </main>

</body>
</html>
