<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Navigationsleiste -->
    <nav class="navbar">
        <a href="#" class="navbar-brand">📝 FlaskBlog</a>
    </nav>

    <!-- Inhalt -->
    <main class="container">
        {% for blogentry in blogentries %}
        <article class="post">
            <h2>{{ blogentry.title }}</h2>
            <div class="post-author">Von {{ blogentry.author }}</div>
            <p class="post-content">{{ blogentry.content }}</p>
        </article>
        {% endfor %}
    </main>

</body>
</html>
